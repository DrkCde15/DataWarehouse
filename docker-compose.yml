services:
  postgres:
    image: docker.io/library/postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-data_warehouse}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/init_airflow_db.sql:/docker-entrypoint-initdb.d/00_init_airflow_db.sql:ro
      - ./sql/create_tables.sql:/docker-entrypoint-initdb.d/01_create_tables.sql:ro
    networks:
      - airflow-net

  airflow-init:
    build: .
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/airflow_db
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      COINGECKO_BASE_URL: ${COINGECKO_BASE_URL:-https://api.coingecko.com/api/v3}
      COINGECKO_API_KEY: ${COINGECKO_API_KEY:-}
      OPENLIBRARY_BASE_URL: ${OPENLIBRARY_BASE_URL:-https://openlibrary.org}
      OPENLIBRARY_USER_AGENT: ${OPENLIBRARY_USER_AGENT:-DataWarehouseBot/1.0 (data@example.com)}
      DB_CONNECTION_STRING: ${DB_CONNECTION_STRING:-postgresql+psycopg2://postgres:postgres@postgres:5432/data_warehouse}
    volumes:
      - ./scripts/init_airflow.sh:/opt/airflow/init_airflow.sh:ro
    entrypoint: /bin/bash
    command: -c "sleep 10 && /opt/airflow/init_airflow.sh"
    depends_on:
      - postgres
    networks:
      - airflow-net

  airflow-webserver:
    build: .
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/airflow_db
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      COINGECKO_BASE_URL: ${COINGECKO_BASE_URL:-https://api.coingecko.com/api/v3}
      COINGECKO_API_KEY: ${COINGECKO_API_KEY:-}
      OPENLIBRARY_BASE_URL: ${OPENLIBRARY_BASE_URL:-https://openlibrary.org}
      OPENLIBRARY_USER_AGENT: ${OPENLIBRARY_USER_AGENT:-DataWarehouseBot/1.0 (data@example.com)}
    ports:
      - "8080:8080"
    volumes:
      - airflow_logs:/home/airflow/logs
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/project/src
      - ./sql:/opt/airflow/sql
    entrypoint: /bin/bash
    command: -c "sleep 60 && airflow webserver"
    depends_on:
      - airflow-init
    networks:
      - airflow-net

  airflow-scheduler:
    build: .
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/airflow_db
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      COINGECKO_BASE_URL: ${COINGECKO_BASE_URL:-https://api.coingecko.com/api/v3}
      COINGECKO_API_KEY: ${COINGECKO_API_KEY:-}
      OPENLIBRARY_BASE_URL: ${OPENLIBRARY_BASE_URL:-https://openlibrary.org}
      OPENLIBRARY_USER_AGENT: ${OPENLIBRARY_USER_AGENT:-DataWarehouseBot/1.0 (data@example.com)}
    volumes:
      - airflow_logs:/home/airflow/logs
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/project/src
      - ./sql:/opt/airflow/sql
    entrypoint: /bin/bash
    command: -c "sleep 60 && airflow scheduler"
    depends_on:
      - airflow-init
    networks:
      - airflow-net

volumes:
  postgres_data:
  airflow_logs:

networks:
  airflow-net:
